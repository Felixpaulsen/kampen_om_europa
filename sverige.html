<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sverige</title>
<style>
  :root {
    --bg: #014F8E;
    --card: #1D3B34;
    --ink: #F4C409;
    --muted: #9FB3AC;
    --accent: #F4C409;
    --accent-dim: #6B5A3A;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 8vh;
    padding-left: 2rem;
    padding-right: 2rem;
  }

  h1 {
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    font-weight: 400;
    letter-spacing: 0.01em;
    margin: 0 0 2rem 0;
    text-align: center;
  }

  p {
    text-align: center;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.5rem;
    margin-top: 3rem;
  }

  .result {
    font-family: 'Courier New', monospace;
    font-size: clamp(2rem, 7vw, 3.5rem);
    color: var(--accent);
    min-height: 1.2em;
    line-height: 1;
  }

  .timer {
    font-family: 'Courier New', monospace;
    font-size: 1.4rem;
    color: var(--ink);
    min-height: 1.2em;
  }

  button {
    font-family: inherit;
    font-size: 1.05rem;
    color: var(--bg);
    background: var(--accent);
    border: none;
    padding: 0.9em 2.2em;
    border-radius: 4px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  button:hover:not(:disabled) {
    transform: translateY(-2px);
  }

  button:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
</style>
</head>
<body>

  <h1>🇸🇪🇸🇪🇸🇪🇸🇪🇸🇪🇸🇪<br><br>Velkommen til Sverige!</h1>
  <p>Din makker og du skal gætte hvilken<br>
    svensk ting, der gemmer sig bag<br>
    anagrammet.<br><br>
    Tid: 2 minutter<br>
    Antal gæt: 1<br><br>
    I skal gætte INDEN tiden er gået.<br><br>
    Tiden starter automatisk, når I<br>
    trykker på knappen.<br><br>
    Hvis I gætter den svenske ting<br>
    må I indtage Sverige på kortet.<br><br></p>

  <div class="stage">
    <div id="actionSlot">
      <button id="rollBtn" onclick="roll()">Vis anagram</button>
    </div>
    <div class="timer" id="timer"></div>
  </div>

  <script>
    function roll() {
      const myList = [
        "Kanelsnegl",
        "Marabou",
        "Stockholm",
        "Pippi",
        "ABBA",
        "Fika",
        "Midsommer",
        "Nobelprisen",
        "Surstrømming",
        "Volvo"
      ]
      const n = Math.floor(Math.random()*10);
      const txt = myList[n].toLowerCase();
      
      let shuffled = txt;
      let attempts = 0;
      while (shuffled === txt && attempts < 100) {
        shuffled = shuffleString(txt);
        attempts++;
      }

      document.getElementById('actionSlot').innerHTML = '<div class="result" id="result">' + shuffled + '</div>';

      startTimer(120);
    }

    function startTimer(seconds) {
      const timerEl = document.getElementById('timer');
      let remaining = seconds;

      const update = () => {
        const mins = Math.floor(remaining / 60);
        const secs = remaining % 60;
        timerEl.textContent = mins + ':' + String(secs).padStart(2, '0');
      };

      update();

      const interval = setInterval(() => {
        remaining--;
        update();

        if (remaining <= 0) {
          clearInterval(interval);
          document.getElementById('result').textContent = '';
          timerEl.textContent = 'Tiden er gået!';
        }
      }, 1000);
    }

    function shuffleString(str) {
        const chars = str.split('');

        for (let i = chars.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [chars[i], chars[j]] = [chars[j], chars[i]];
        }

        return chars.join('');
    }
  </script>

</body>
</html>
